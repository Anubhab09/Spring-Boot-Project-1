spring.datasource.url=jdbc:postgresql://user-db:5432/userdb
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}

# optional: final tuning
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.cache.type=redis

# run the app on container port 8080 (docker-compose maps host ports)
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.metrics.tags.environment=docker-local
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
