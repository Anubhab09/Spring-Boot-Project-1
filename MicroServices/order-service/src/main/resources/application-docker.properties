spring.datasource.url=jdbc:postgresql://order-db:5432/orderdb
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user1234}

spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}

# optional: final tuning
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.cache.type=redis

# run the app on container port 8080 (docker-compose maps host ports)
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.metrics.tags.environment=docker-local
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=order-event-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=order-created
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false
spring.kafka.producer.properties.spring.json.add.type.headers=false
