name: CI — test · build · push

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKERHUB_NAMESPACE: anubhab09

jobs:
  user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Test
        run: mvn -B -f MicroServices/user-service/pom.xml clean verify

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: MicroServices/user-service
          file: MicroServices/user-service/Dockerfile
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/user-service:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/user-service:${{ github.sha }}

  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Test
        run: mvn -B -f MicroServices/order-service/pom.xml clean verify

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: MicroServices/order-service
          file: MicroServices/order-service/Dockerfile
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/order-service:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/order-service:${{ github.sha }}

  inventory-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Test
        run: mvn -B -f MicroServices/inventory-service/pom.xml clean verify

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: MicroServices/inventory-service
          file: MicroServices/inventory-service/Dockerfile
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/inventory-service:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/inventory-service:${{ github.sha }}
